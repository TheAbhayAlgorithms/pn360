{% extends 'base.html' %}
{% load static %}

{% block title %}Candidate Registration - Placement Nexus 360{% endblock %}

{% block content %}
<div class="center-container" style="max-width: 580px;">
    <div class="glass-card" style="padding: 40px 36px;">
        <div style="text-align: center; margin-bottom: 28px;">
            <div class="logo-icon" style="margin: 0 auto 16px; width: 52px; height: 52px; font-size: 24px; background: linear-gradient(135deg, var(--accent-emerald), var(--accent-blue));">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 6px;">Create Candidate Profile</h2>
            <p style="color: var(--text-secondary); font-size: 14px;">Join the complete AI preparation pipeline for placement success</p>
        </div>

        <form method="POST" action="{% url 'register' %}" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="grid-2" style="margin-bottom: 20px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">
                        <i class="fa-solid fa-user" style="color: var(--accent-blue);"></i> Full Name / Username
                    </label>
                    <input type="text" name="username" class="form-control" placeholder="e.g. Rahul Sharma" required autofocus>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">
                        <i class="fa-solid fa-phone" style="color: var(--accent-emerald);"></i> Phone Number
                    </label>
                    <input type="text" name="phone" class="form-control" placeholder="e.g. 9876543210" required>
                </div>
            </div>

            <div class="grid-2" style="margin-bottom: 20px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">
                        <i class="fa-solid fa-lock" style="color: var(--accent-indigo);"></i> Password
                    </label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">
                        <i class="fa-solid fa-shield-check" style="color: var(--accent-emerald);"></i> Confirm Password
                    </label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 26px;">
                <label class="form-label">
                    <i class="fa-solid fa-image" style="color: var(--text-muted);"></i> Profile Picture (Optional)
                </label>
                <input type="file" name="image" accept="image/*" class="form-control">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; height: 48px; font-size: 15px;">
                Complete Registration <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div style="text-align: center; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-subtle); font-size: 14px; color: var(--text-secondary);">
            Already have an account? 
            <a href="{% url 'login' %}" style="color: var(--accent-blue); text-decoration: none; font-weight: 600; margin-left: 4px;">
                Sign In &rarr;
            </a>
        </div>
    </div>
</div>
{% endblock %}
