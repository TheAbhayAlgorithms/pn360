{% extends 'base.html' %}
{% load static %}

{% block title %}Sign In - Placement Nexus 360{% endblock %}

{% block content %}
<div class="center-container">
    <div class="glass-card" style="padding: 40px 36px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <div class="logo-icon" style="margin: 0 auto 16px; width: 52px; height: 52px; font-size: 24px;">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 6px;">Sign In to Your Account</h2>
            <p style="color: var(--text-secondary); font-size: 14px;">Enter your credentials to access your candidate or coordinator console</p>
        </div>

        <form method="POST" action="{% url 'login' %}" autocomplete="off">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">
                    <i class="fa-solid fa-phone" style="color: var(--accent-blue);"></i> Phone Number
                </label>
                <input type="text" name="phone" class="form-control" placeholder="e.g. 9876543210" required autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label class="form-label">
                    <i class="fa-solid fa-key" style="color: var(--accent-indigo);"></i> Password
                </label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; height: 48px; font-size: 15px;">
                Sign In to Platform <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div style="text-align: center; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-subtle); font-size: 14px; color: var(--text-secondary);">
            Don't have an account yet? 
            <a href="{% url 'register' %}" style="color: var(--accent-blue); text-decoration: none; font-weight: 600; margin-left: 4px;">
                Register Free &rarr;
            </a>
        </div>
    </div>
</div>
{% endblock %}
